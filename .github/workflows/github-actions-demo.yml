name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Check out the code
      uses: actions/checkout@v4
    - name: Compute image tags
      # Computed once so build and push agree even across an hour boundary (UTC).
      run: |
        NOW=$(date -u +%s)
        echo "TAG_DATE=$(date -u -d "@$NOW" +%Y-%m-%d)" >> "$GITHUB_ENV"
        echo "TAG_HOUR=$(date -u -d "@$NOW" +%Y-%m-%d-%H)" >> "$GITHUB_ENV"
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag ghcr.io/egormak/tracker-server:$TAG_HOUR --tag ghcr.io/egormak/tracker-server:$TAG_DATE --tag ghcr.io/egormak/tracker-server:latest
    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Push the Docker image
      run: |
        docker push ghcr.io/egormak/tracker-server:$TAG_HOUR
        docker push ghcr.io/egormak/tracker-server:$TAG_DATE
        docker push ghcr.io/egormak/tracker-server:latest
      